services:
  - type: web
    name: xau-ai-strategy-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TWELVE_DATA_SYMBOL
        value: XAU/USD
      - key: TWELVE_DATA_INTERVAL
        value: 5min
      - key: TWELVE_DATA_OUTPUTSIZE
        value: 120
      - key: MARKET_CACHE_SECONDS
        value: 60
